<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise BI | Gestão de Implantação</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --info: #0ea5e9;
            --slate-50: #f8fafc; --slate-200: #e2e8f0; --slate-700: #334155; --slate-900: #0f172a;
            --whatsapp: #25D366;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f1f5f9; color: var(--slate-900); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        aside { width: 260px; background: var(--slate-900); color: white; display: flex; flex-direction: column; }
        .logo-area { padding: 25px; border-bottom: 1px solid #1e293b; font-weight: 800; color: #38bdf8; font-size: 18px; text-align: center; }
        .nav-item { padding: 15px 25px; cursor: pointer; color: #94a3b8; transition: 0.2s; border-left: 4px solid transparent; font-size: 14px; }
        .nav-item:hover, .nav-item.active { background: #1e293b; color: white; border-left-color: var(--primary); }

        /* Main Content */
        main { flex: 1; overflow-y: auto; padding: 30px; }
        .page { display: none; max-width: 1200px; margin: 0 auto; }
        .page.active { display: block; }

        /* Componentes */
        .card { background: white; padding: 25px; border-radius: 12px; border: 1px solid var(--slate-200); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 25px; }
        .kpi-card { background: white; padding: 18px; border-radius: 12px; border-top: 4px solid #ddd; }
        .kpi-card span { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; }
        .kpi-card strong { font-size: 24px; display: block; margin-top: 5px; }

        .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-danger { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .btn-outline { background: white; border: 1px solid #d1d5db; color: #374151; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
        
        .btn-whats-icon { color: var(--whatsapp); font-size: 24px; text-decoration: none; transition: transform 0.2s; display: inline-block; }
        .btn-whats-icon:hover { transform: scale(1.2); }

        input, select { padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px; outline: none; background: #f8fafc; width: 100%; }
        label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 5px; display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: #f8fafc; text-align: left; padding: 12px; font-size: 12px; color: #64748b; border-bottom: 1px solid var(--slate-200); }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 13px; vertical-align: middle; }

        .progress-container { height: 10px; background: #e2e8f0; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .progress-bar { height: 100%; transition: width 0.6s ease; }
        
        .hidden { display: none; }
        #modalOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
    </style>
</head>
<body>

<div id="modalOverlay">
    <div class="card" style="width: 450px;">
        <h3>Anotações da Etapa</h3>
        <textarea id="modalTextarea" rows="5" style="width:100%; margin:15px 0; border:1px solid #ddd; padding:10px; border-radius:8px;"></textarea>
        <div style="display:flex; gap:10px;">
            <button class="btn-primary" onclick="Modal.salvar()" style="flex:1">Salvar Nota</button>
            <button class="btn-outline" onclick="Modal.fechar()" style="flex:1">Fechar</button>
        </div>
        <input type="hidden" id="modalProjId"><input type="hidden" id="modalEtapaIdx">
    </div>
</div>

<aside>
    <div class="logo-area">ENTERPRISE BI</div>
    <div class="nav-item active" onclick="UI.page('dashboard', this)">📊 Dashboard</div>
    <div class="nav-item" onclick="UI.page('clientes', this)">🏢 Clientes</div>
    <div class="nav-item" onclick="UI.page('novo-projeto', this)">🚀 Novo Projeto</div>
    <div class="nav-item" onclick="UI.page('config', this)">⚙️ Configurações</div>
</aside>

<main>
    <!-- DASHBOARD -->
    <section id="dashboard" class="page active">
        <div class="kpi-grid">
            <div class="kpi-card" style="border-top-color: var(--slate-700)"><span>Total</span><strong id="kTotal">0</strong></div>
            <div class="kpi-card" style="border-top-color: var(--info)"><span>Andamento</span><strong id="kAndamento">0</strong></div>
            <div class="kpi-card" style="border-top-color: var(--warning)"><span>Aguardando</span><strong id="kAtivos">0</strong></div>
            <div class="kpi-card" style="border-top-color: var(--danger)"><span>Atrasados</span><strong id="kAtraso">0</strong></div>
            <div class="kpi-card" style="border-top-color: var(--success)"><span>Finalizados</span><strong id="kFim">0</strong></div>
        </div>
        <div id="listaProjetos"></div>
    </section>

    <!-- CLIENTES -->
    <section id="clientes" class="page">
        <div class="card">
            <h3>Novo Cadastro</h3>
            <div style="display:grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap:15px; margin-top:15px;">
                <div><label>Razão Social</label><input type="text" id="cliNome"></div>
                <div><label>Responsável</label><input type="text" id="cliResp" placeholder="Ex: João"></div>
                <div><label>CNPJ</label><input type="text" id="cliCnpj"></div>
                <div><label>WhatsApp</label><input type="text" id="cliTel" placeholder="46999999999"></div>
            </div>
            <button class="btn-primary" style="margin-top:20px;" onclick="Data.addCliente()">Salvar Cliente</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Razão Social</th>
                        <th>Responsável</th>
                        <th>CNPJ</th>
                        <th>Telefone</th>
                        <th style="text-align:center">WhatsApp</th>
                        <th style="text-align:right">Ações</th>
                    </tr>
                </thead>
                <tbody id="listaClientes"></tbody>
            </table>
        </div>
    </section>

    <!-- NOVO PROJETO -->
    <section id="novo-projeto" class="page">
        <div class="card">
            <h3>Lançar Cronograma</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px;">
                <div><label>Cliente</label><select id="selCliente"></select></div>
                <div><label>Prazo Entrega</label><input type="date" id="selPrazo"></div>
                <div><label>Consultor</label><select id="selConsultor"></select></div>
                <div><label>Vendedor</label><select id="selVendedor"></select></div>
            </div>
            <div style="margin-top:20px;">
                <label>Treinamentos Inclusos:</label>
                <div id="checkModulos" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;"></div>
            </div>
            <button class="btn-primary" onclick="Data.addProjeto()" style="width:100%; margin-top:30px; padding:15px;">Gerar Cronograma</button>
        </div>
    </section>

    <!-- CONFIGURAÇÕES -->
    <section id="config" class="page">
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:20px;">
            <div class="card">
                <h4>Consultores</h4>
                <div style="display:flex; gap:5px; margin:10px 0;"><input type="text" id="inCons"><button class="btn-primary" onclick="Data.addBase('consultores','inCons')">+</button></div>
                <div id="listCons"></div>
            </div>
            <div class="card">
                <h4>Vendedores</h4>
                <div style="display:flex; gap:5px; margin:10px 0;"><input type="text" id="inVend"><button class="btn-primary" onclick="Data.addBase('vendedores','inVend')">+</button></div>
                <div id="listVend"></div>
            </div>
            <div class="card">
                <h4>Módulos</h4>
                <div style="display:flex; gap:5px; margin:10px 0;"><input type="text" id="inMod"><button class="btn-primary" onclick="Data.addBase('modulos','inMod')">+</button></div>
                <div id="listMod"></div>
            </div>
        </div>
    </section>
</main>

<script>
    // CONFIGURAÇÃO FIREBASE (Substitua se necessário)
    const firebaseConfig = {
        apiKey: "AIzaSyAFmeGJyQWgZFAVn5vvMvcdEJhz84UWgvc",
        authDomain: "implantacao-b7080.firebaseapp.com",
        projectId: "implantacao-b7080",
        storageBucket: "implantacao-b7080.firebasestorage.app",
        messagingSenderId: "826303843854",
        appId: "1:826303843854:web:9547d323535982141bf65f",
        measurementId: "G-S59SYCZYNY"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let DB = { clientes: [], consultores: [], vendedores: [], modulos: [], projetos: [] };
    let expandidos = new Set();

    async function Save() { await db.collection('app').doc('dados').set(DB); }

    function Load() {
        db.collection('app').doc('dados').onSnapshot((doc) => {
            if (doc.exists) { DB = doc.data(); App.init(); }
            else { App.init(); }
        });
    }

    const UI = {
        page(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(el) el.classList.add('active');
        }
    };

    const Modal = {
        abrir(pId, idx) {
            const p = DB.projetos.find(x => x.id === pId);
            document.getElementById('modalProjId').value = pId;
            document.getElementById('modalEtapaIdx').value = idx;
            document.getElementById('modalTextarea').value = p.etapas[idx].obs || "";
            document.getElementById('modalOverlay').style.display = 'flex';
        },
        fechar() { document.getElementById('modalOverlay').style.display = 'none'; },
        async salvar() {
            const id = parseInt(document.getElementById('modalProjId').value);
            const idx = parseInt(document.getElementById('modalEtapaIdx').value);
            const proj = DB.projetos.find(x => x.id === id);
            if(proj) { proj.etapas[idx].obs = document.getElementById('modalTextarea').value; await Save(); }
            this.fechar();
        }
    };

    const Data = {
        async addCliente() {
            const n = document.getElementById('cliNome').value;
            const r = document.getElementById('cliResp').value;
            const t = document.getElementById('cliTel').value.replace(/\D/g, '');
            if(!n || !t) return alert("Nome e WhatsApp são obrigatórios");
            if(!DB.clientes) DB.clientes = [];
            DB.clientes.push({ id: Date.now(), nome: n, responsavel: r, cnpj: cliCnpj.value, tel: t });
            await Save();
            document.getElementById('cliNome').value = ""; document.getElementById('cliResp').value = ""; document.getElementById('cliTel').value = ""; document.getElementById('cliCnpj').value = "";
        },
        async addBase(t, i) {
            const v = document.getElementById(i).value;
            if(!v) return;
            if(!DB[t]) DB[t] = [];
            DB[t].push(v); document.getElementById(i).value = ""; await Save();
        },
        async delBase(t, idx) { DB[t].splice(idx, 1); await Save(); },
        async delCliente(id) { if(confirm("Excluir cliente?")) { DB.clientes = DB.clientes.filter(c => c.id !== id); await Save(); } },
        async addProjeto() {
            const mods = [...document.querySelectorAll('[name=modCheck]:checked')].map(m => m.value);
            if(!selCliente.value || !selPrazo.value) return alert("Selecione cliente e prazo.");
            const etapas = [
                { nome: 'Kick-off', peso: 10, done: false, obs: '' },
                { nome: 'Parâmetros', peso: 15, done: false, obs: '' },
                ...mods.map(m => ({ nome: `Treinamento: ${m}`, peso: 55/mods.length, done: false, obs: '' })),
                { nome: 'Entrega Final', peso: 20, done: false, obs: '' }
            ];
            if(!DB.projetos) DB.projetos = [];
            DB.projetos.push({ 
                id: Date.now(), 
                cliente: selCliente.value, 
                consultor: selConsultor.value, 
                vendedor: selVendedor.value, 
                prazo: selPrazo.value, 
                dataCriacao: new Date().toISOString().split('T')[0],
                etapas 
            });
            await Save(); 
            UI.page('dashboard', document.querySelector('.nav-item'));
        }
    };

    const App = {
        init() {
            // Selects
            const fill = (id, list) => {
                const el = document.getElementById(id); if(!el) return;
                el.innerHTML = '<option value="">Selecionar...</option>' + (list || []).map(i => `<option value="${i.nome || i}">${i.nome || i}</option>`).join('');
            };
            fill('selCliente', DB.clientes); fill('selConsultor', DB.consultores); fill('selVendedor', DB.vendedores);
            
            // Renderizar Clientes com link WhatsApp
            document.getElementById('listaClientes').innerHTML = (DB.clientes || []).map(c => {
                const telF = c.tel.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3');
                const saudacao = encodeURIComponent(`Olá ${c.responsavel}, aqui é Alan, coordenador de implantação, gostaria de conversar um momento a respeito da implantação`);
                return `<tr>
                    <td><b>${c.nome}</b></td>
                    <td>${c.responsavel || '-'}</td>
                    <td>${c.cnpj || '-'}</td>
                    <td>${telF}</td>
                    <td style="text-align:center">
                        <a href="https://wa.me/55${c.tel}?text=${saudacao}" target="_blank" class="btn-whats-icon"><i class="fab fa-whatsapp"></i></a>
                    </td>
                    <td style="text-align:right"><button class="btn-danger" onclick="Data.delCliente(${c.id})">Remover</button></td>
                </tr>`;
            }).join('');

            // Configurações
            const listB = (id, t) => {
                const el = document.getElementById(id); if(el) el.innerHTML = (DB[t] || []).map((v, idx) => `<div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #eee; font-size:13px;">${v} <span onclick="Data.delBase('${t}',${idx})" style="color:red; cursor:pointer">✕</span></div>`).join('');
            };
            listB('listCons', 'consultores'); listB('listVend', 'vendedores'); listB('listMod', 'modulos');
            document.getElementById('checkModulos').innerHTML = (DB.modulos || []).map(m => `<label style="padding:6px 12px; background:#f1f5f9; border-radius:6px; cursor:pointer;"><input type="checkbox" name="modCheck" value="${m}"> ${m}</label>`).join('');
            
            this.renderDashboard();
        },

        renderDashboard() {
            const container = document.getElementById('listaProjetos');
            container.innerHTML = "";
            let stats = { t:0, and:0, agu:0, atr:0, f:0 };
            const hoje = new Date(); hoje.setHours(0,0,0,0);

            if(!DB.projetos || !DB.projetos.length) { container.innerHTML = "<p style='color:#64748b'>Nenhum cronograma ativo.</p>"; return; }

            DB.projetos.forEach(p => {
                let prog = 0; p.etapas.forEach(e => { if(e.done) prog += e.peso });
                const perc = Math.round(prog);
                const dtPrazo = new Date(p.prazo + 'T00:00:00');
                const dtCriacao = new Date((p.dataCriacao || p.prazo) + 'T00:00:00');
                const atrasado = perc < 100 && (dtPrazo < hoje || Math.ceil(Math.abs(hoje - dtCriacao) / (1000 * 60 * 60 * 24)) >= 8);

                stats.t++;
                if(perc === 100) stats.f++; else if(perc > 0) stats.and++; else stats.agu++;
                if(atrasado) stats.atr++;

                const card = document.createElement('div');
                card.className = 'project-card card';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start">
                        <div><h2 style="font-size:18px">${p.cliente}</h2><small style="color:#64748b">Cons: ${p.consultor} | Vend: ${p.vendedor}</small></div>
                        <div style="text-align:right"><b style="color:${atrasado?'red':'#2563eb'}">${perc}%</b><br><small>Prazo: ${p.prazo.split('-').reverse().join('/')}</small></div>
                    </div>
                    <div class="progress-container"><div class="progress-bar" style="width:${perc}%; background:${atrasado?'var(--danger)':'var(--primary)'}"></div></div>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-outline" onclick="App.toggleExp(${p.id})">Ver Etapas</button>
                        <button class="btn-danger" style="background:none; color:red; border:none" onclick="if(confirm('Excluir?')) { DB.projetos = DB.projetos.filter(x=>x.id!==${p.id}); Save(); }">Excluir</button>
                    </div>
                    <div class="${expandidos.has(p.id)?'':'hidden'}" style="margin-top:15px; border-top:1px solid #eee; padding-top:10px;">
                        ${p.etapas.map((e, i) => `
                            <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dotted #eee; font-size:12px;">
                                <div><b>${e.nome}</b><br><small style="color:blue">${e.obs || ''}</small></div>
                                <div style="display:flex; gap:5px;">
                                    <button class="btn-outline" style="font-size:10px; padding:2px 5px;" onclick="Modal.abrir(${p.id}, ${i})">Nota</button>
                                    <button onclick="App.toggleEtapa(${p.id}, ${i})" style="border:none; background:${e.done?'#dcfce7':'#eee'}; padding:4px 8px; border-radius:4px; cursor:pointer">${e.done?'✅':'Fazer'}</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(card);
            });
            kTotal.innerText=stats.t; kAndamento.innerText=stats.and; kAtivos.innerText=stats.agu; kAtraso.innerText=stats.atr; kFim.innerText=stats.f;
        },
        toggleExp(id) { if(expandidos.has(id)) expandidos.delete(id); else expandidos.add(id); this.renderDashboard(); },
        async toggleEtapa(pId, idx) { const p = DB.projetos.find(x => x.id === pId); p.etapas[idx].done = !p.etapas[idx].done; await Save(); }
    };

    window.onload = Load;
</script>
</body>
</html>
